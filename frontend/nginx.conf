server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Resolução dinâmica: o nginx não quebra se o gateway reiniciar.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $gw "http://gateway:8080";
    proxy_pass $gw;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
  }

  location = /status {
    set $gw "http://gateway:8080";
    proxy_pass $gw;
  }

  location / {
    try_files $uri /index.html;
  }
}
