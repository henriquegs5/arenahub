name: arenahub

x-service-defaults: &svc
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"   # painel: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  identidade:
    <<: *svc
    build: ./services/identidade
    environment:
      PORT: 3001
      DATABASE_URL: postgres://identidade_user:identidade_pw@postgres:5432/identidade_db
      JWT_SECRET: ${JWT_SECRET:-arenahub-dev-secret-change-me}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

  equipes:
    <<: *svc
    build: ./services/equipes
    environment:
      PORT: 3002
      DATABASE_URL: postgres://equipes_user:equipes_pw@postgres:5432/equipes_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

  torneios:
    <<: *svc
    build: ./services/torneios
    environment:
      PORT: 3003
      DATABASE_URL: postgres://torneios_user:torneios_pw@postgres:5432/torneios_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

  partidas:
    <<: *svc
    build: ./services/partidas
    environment:
      PORT: 3004
      DATABASE_URL: postgres://partidas_user:partidas_pw@postgres:5432/partidas_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

  ranking:
    <<: *svc
    build: ./services/ranking
    environment:
      PORT: 3005
      DATABASE_URL: postgres://ranking_user:ranking_pw@postgres:5432/ranking_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

  notificacoes:
    <<: *svc
    build: ./services/notificacoes
    environment:
      PORT: 3006
      DATABASE_URL: postgres://notificacoes_user:notificacoes_pw@postgres:5432/notificacoes_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

  gateway:
    build: ./gateway
    restart: unless-stopped
    depends_on: [identidade, equipes, torneios, partidas, ranking, notificacoes]
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-arenahub-dev-secret-change-me}
      IDENTIDADE_URL: http://identidade:3001
      EQUIPES_URL: http://equipes:3002
      TORNEIOS_URL: http://torneios:3003
      PARTIDAS_URL: http://partidas:3004
      RANKING_URL: http://ranking:3005
      NOTIFICACOES_URL: http://notificacoes:3006

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [gateway]
    ports:
      - "3000:80"   # interface: http://localhost:3000

volumes:
  pgdata:
